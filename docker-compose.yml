version: '3.8'

services:
  tiendavirtual:
    build: tiendavirtual
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/tienda_virtual?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: Lumatofi12
    restart: always
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql_tiendavirtual
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Lumatofi12
      MYSQL_PASSWORD: Lumatofi12
      MYSQL_DATABASE: tienda_virtual
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 10