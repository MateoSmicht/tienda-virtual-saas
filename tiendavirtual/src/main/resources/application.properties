spring.application.name=tiendavirtual
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracion de Spring Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:default@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:default_pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuracion de Mercado Pago (Credenciales de Prueba)
mercadopago.access.token=${MP_ACCESS_TOKEN:TEST-access-token-por-defecto}

mercado.pago.webhook.url=https://fluttery-groovelike-micah.ngrok-free.dev
