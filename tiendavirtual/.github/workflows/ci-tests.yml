name: Spring Boot Tests (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Tests con Maven
        run: >
          mvn -B -e test 
          "-Dmercadopago.access.token=test_token" 
          "-Dmercado.pago.webhook.url=http://localhost:8080" 
          "-Dspring.mail.host=smtp.gmail.com" 
          "-Dspring.mail.port=587" 
          "-Dspring.mail.username=test" 
          "-Dspring.mail.password=test" 
          "-Dspring.main.allow-bean-definition-overriding=true"